<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#g)"/>

  <!-- QR Pattern -->
  <g fill="#ffffff">
    <!-- Top Left -->
    <rect x="12" y="12" width="14" height="14" rx="2"/>
    <rect x="16" y="16" width="6" height="6" rx="1" fill="#6366F1"/>

    <!-- Top Right -->
    <rect x="38" y="12" width="14" height="14" rx="2"/>
    <rect x="42" y="16" width="6" height="6" rx="1" fill="#6366F1"/>

    <!-- Bottom Left -->
    <rect x="12" y="38" width="14" height="14" rx="2"/>
    <rect x="16" y="42" width="6" height="6" rx="1" fill="#6366F1"/>

    <!-- Center Pattern -->
    <rect x="30" y="28" width="4" height="4"/>
    <rect x="36" y="28" width="4" height="4"/>
    <rect x="24" y="34" width="4" height="4"/>
    <rect x="30" y="34" width="4" height="4"/>
    <rect x="42" y="34" width="4" height="4"/>
    <rect x="30" y="40" width="4" height="4"/>
    <rect x="36" y="40" width="4" height="4"/>
  </g>
</svg>